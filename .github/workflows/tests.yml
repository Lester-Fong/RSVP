name: tests

on:
  push:
    branches:
      - master
      - 'integration/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: PHP 8.2 / SQLite and frontend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      DATABASE_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: '1'
      DB_USERNAME: ci-no-mysql
      DB_PASSWORD: ''
      CMS_MYSQL_TEST_ENABLED: 'false'
      CACHE_STORE: array
      SESSION_DRIVER: array
      SESSION_PATH: /
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: mbstring, dom, xml, xmlwriter, fileinfo, gd, exif, pdo_sqlite, sqlite3
          ini-values: memory_limit=256M, upload_max_filesize=5M, post_max_size=8M
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Prepare isolated runtime
        shell: bash
        run: |
          ci_runtime="$RUNNER_TEMP/rsvp-tests"
          mkdir -p "$ci_runtime/storage"/{app/private,framework/cache/data,framework/sessions,framework/views,logs}
          {
            printf 'APP_CONFIG_CACHE=%s\n' "$ci_runtime/config.php"
            printf 'APP_ROUTES_CACHE=%s\n' "$ci_runtime/routes.php"
            printf 'LARAVEL_STORAGE_PATH=%s\n' "$ci_runtime/storage"
            printf 'APP_KEY=base64:%s\n' "$(php -r 'echo base64_encode(random_bytes(32));')"
          } >> "$GITHUB_ENV"
          test ! -e "$ci_runtime/config.php"
          test ! -e "$ci_runtime/routes.php"

      - name: Install locked dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          npm ci

      - name: Verify guarded SQLite and image prerequisites
        shell: bash
        run: |
          php <<'PHP'
          <?php
          require 'tests/bootstrap.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          Tests\Support\TestDatabaseGuard::assertApplicationUsesIsolatedSqlite($app);
          $pdo = $app->make('db')->connection()->getPdo();
          if ($pdo->getAttribute(PDO::ATTR_DRIVER_NAME) !== 'sqlite'
              || $pdo->query('PRAGMA database_list')->fetch(PDO::FETCH_ASSOC)['file'] !== '') {
              throw new RuntimeException('CI requires resolved in-memory SQLite.');
          }
          foreach (['imagejpeg', 'imagepng', 'imagewebp', 'exif_read_data'] as $function) {
              if (! function_exists($function)) {
                  throw new RuntimeException('Missing image prerequisite: '.$function);
              }
          }
          echo "Guarded in-memory SQLite and image prerequisites verified.\n";
          PHP

      - name: Verify database isolation regressions
        run: php vendor/bin/phpunit --no-progress tests/Unit/TestDatabaseGuardTest.php tests/Feature/TestingDatabaseIsolationTest.php

      - name: Build Assets
        run: npm run build

      - name: Run frontend contract and renderer tests
        run: node --test tests/Frontend/PhotoboothOpening.test.mjs tests/Frontend/ModernClassicInvitation.test.mjs tests/Frontend/WeddingCountdown.test.mjs tests/Frontend/CmsGuestGuide.test.mjs tests/Frontend/CmsV2Contracts.test.mjs

      - name: Run full PHP suite
        run: php vendor/bin/phpunit --no-progress

      - name: Record coverage boundary
        if: ${{ !cancelled() }}
        run: |
          printf '%s\n' 'Default database: isolated in-memory SQLite; no MySQL service or production credentials.' 'Disposable InnoDB opt-ins are disabled and remain skipped, not verified.' 'This workflow runs Node contracts/renderers, not the separately gated browser/device suites.' >> "$GITHUB_STEP_SUMMARY"
